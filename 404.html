<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面不存在 · 季亦飞 AIGC 电商视觉设计</title>
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#0E0D0C">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#0E0D0C;color:#F4F0E9;min-height:100vh;
    display:grid;place-items:center;padding:28px;text-align:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .box{max-width:520px}
  .code{font-size:clamp(64px,18vw,120px);font-weight:800;line-height:1;letter-spacing:-.04em;color:#D9A05B}
  h1{margin-top:16px;font-size:clamp(20px,4vw,28px);font-weight:700}
  p{margin-top:14px;color:#C9C2B6;line-height:1.85;font-size:15px}
  .links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:30px}
  a{display:inline-block;padding:12px 22px;border-radius:999px;font-weight:700;font-size:14.5px;
    text-decoration:none;background:#D9A05B;color:#2A1D0C;transition:background .2s,color .2s,border-color .2s}
  a.ghost{background:transparent;color:#F4F0E9;border:1px solid rgba(244,240,233,.18)}
  a.ghost:hover{border-color:#D9A05B;color:#D9A05B;background:transparent}
  a:hover{background:#F0C48A}
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>这个页面不存在</h1>
    <p>链接可能已经变更，或者地址输错了。<br>回到作品集首页继续看吧。</p>
    <div class="links">
      <a href="./">返回作品集首页</a>
      <a class="ghost" href="https://kongxiu7.github.io/portfolio/">旧版作品集</a>
    </div>
  </div>
</body>
</html>
